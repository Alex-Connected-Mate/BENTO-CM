<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Dys Keyboard icon">
  <defs>
    <linearGradient id="dys-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="55%" stop-color="#F35E5E"/>
      <stop offset="100%" stop-color="#C73D7C"/>
    </linearGradient>
    <linearGradient id="dys-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#dys-bg)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#dys-shine)"/>

  <!-- Row 1: 10 keys -->
  <g>
    <rect x="120" y="284" width="74" height="74" rx="18" fill="#FFE9A8"/>
    <rect x="202" y="284" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="284" y="284" width="74" height="74" rx="18" fill="#B7E8FF"/>
    <rect x="366" y="284" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="448" y="284" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="530" y="284" width="74" height="74" rx="18" fill="#FFD7E0"/>
    <rect x="612" y="284" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="694" y="284" width="74" height="74" rx="18" fill="#C9F0CA"/>
    <rect x="776" y="284" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="858" y="284" width="46" height="74" rx="18" fill="#FFE9A8"/>
  </g>

  <!-- Row 2: 9 keys (slightly indented) -->
  <g>
    <rect x="160" y="378" width="74" height="74" rx="18" fill="#FFE9A8"/>
    <rect x="242" y="378" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="324" y="378" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="406" y="378" width="74" height="74" rx="18" fill="#B7E8FF"/>
    <rect x="488" y="378" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="570" y="378" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="652" y="378" width="74" height="74" rx="18" fill="#FFD7E0"/>
    <rect x="734" y="378" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="816" y="378" width="74" height="74" rx="18" fill="#FFE9A8"/>
  </g>

  <!-- Row 3: 7 keys + 2 wider end keys -->
  <g>
    <rect x="120" y="472" width="106" height="74" rx="18" fill="#FFE9A8"/>
    <rect x="234" y="472" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="316" y="472" width="74" height="74" rx="18" fill="#C9F0CA"/>
    <rect x="398" y="472" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="480" y="472" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="562" y="472" width="74" height="74" rx="18" fill="#B7E8FF"/>
    <rect x="644" y="472" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="726" y="472" width="74" height="74" rx="18" fill="#FFD7E0"/>
    <rect x="808" y="472" width="106" height="74" rx="18" fill="#FFE9A8"/>
  </g>

  <!-- Row 4: spacebar + globe -->
  <g>
    <rect x="120" y="566" width="124" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="252" y="566" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="334" y="566" width="356" height="74" rx="18" fill="#FFFFFF"/>
    <rect x="698" y="566" width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="780" y="566" width="134" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.96"/>
  </g>

  <!-- Tactile dot on F key (homing bump) -->
  <circle cx="365" cy="525" r="6" fill="#0a0a0b" fill-opacity="0.18"/>
  <circle cx="681" cy="525" r="6" fill="#0a0a0b" fill-opacity="0.18"/>

  <!-- Soft top highlight -->
  <rect x="60" y="80" width="904" height="120" rx="60" fill="#FFFFFF" fill-opacity="0.06"/>
</svg>
