<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a80ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6498ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg-grad)" />
  <!-- Accent ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.6" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="#4a80ff" stroke-width="1" opacity="0.2" />
  <!-- Subtle decorative arcs -->
  <path d="M 80 320 A 160 160 0 0 1 320 320" fill="none" stroke="#4a80ff" stroke-width="1" opacity="0.15" />
  <path d="M 100 300 A 140 140 0 0 1 300 300" fill="none" stroke="#4a80ff" stroke-width="1" opacity="0.1" />
  <!-- Inner circle for initials -->
  <circle cx="200" cy="190" r="100" fill="#0d1a33" />
  <circle cx="200" cy="190" r="100" fill="none" stroke="#4a80ff" stroke-width="2" opacity="0.4" />
  <!-- Initials -->
  <text x="200" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="4">AC</text>
  <!-- Name below -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8090b0" letter-spacing="2">ALEX CORMERAIE</text>
  <!-- Bottom accent line -->
  <line x1="140" y1="355" x2="260" y2="355" stroke="#4a80ff" stroke-width="2" opacity="0.4" />
</svg>
