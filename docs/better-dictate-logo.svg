<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="mic-grad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <!-- Microphone body -->
  <ellipse cx="230" cy="160" rx="50" ry="70" fill="url(#mic-grad)" opacity="0.95"/>
  <!-- Mic lines -->
  <line x1="200" y1="145" x2="215" y2="145" stroke="#1976D2" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="200" y1="160" x2="215" y2="160" stroke="#1976D2" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="200" y1="175" x2="215" y2="175" stroke="#1976D2" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- Mic stand -->
  <path d="M230 230 L230 270" stroke="url(#mic-grad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M210 270 L250 270" stroke="url(#mic-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Mic arc -->
  <path d="M175 180 Q175 250 230 250 Q285 250 285 180" stroke="url(#mic-grad)" stroke-width="6" fill="none" opacity="0.7"/>
  <!-- Play button -->
  <path d="M220 155L240 168L220 181Z" fill="#1976D2" opacity="0.6"/>
  <!-- Sound waves -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M290 130 Q305 110 310 130 Q315 150 330 130 Q345 110 350 130"/>
    <path d="M285 155 Q305 130 313 155 Q321 180 340 155 Q359 130 367 155" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="256" y="370" font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="56" fill="#ffffff" text-anchor="middle">BetterDictate</text>
</svg>
